# =============================================================================
# SCRIPT DE DOWNLOAD (NPI_Down_v4.py)
# Baixa do Google Earth Engine os rasters mensais de área queimada (MCD64A1),
# recortados pela região definida em global.shp_path.
# As credenciais (key_file) são montadas no container via docker-compose,
# a partir da variável EE_CREDENTIALS_PATH definida no .env.
# =============================================================================
down:
  # Ano inicial do período de download
  start_year:  2000                     
  # Mês inicial do período (1-12)
  start_month: 1                        
  # Ano final do período de download
  end_year:    2024                     
  # Mês final do período (1-12)
  end_month:   12                       

  # Pasta de saída dos rasters baixados
  out_dir:  "Raster/MODIS_BurnDate_RAW" 
  # Nome do arquivo de log (salvo dentro de out_dir)
  log_file: "_download_log.json"        

  # Resolução espacial de exportação, em metros
  scale:       500                      
  # CRS geográfico WGS84 — padrão dos rasters de saída
  crs:         "EPSG:4326"              
  # Pausa entre downloads bem-sucedidos (segundos)
  pause_sec:   1                        
  # Número máximo de tentativas por mês em caso de erro
  max_retries: 3                        

  # Conta de serviço do GEE
  service_account: "gee-894@modis-500120.iam.gserviceaccount.com"  
  # Caminho da chave JSON de credenciais dentro do container
  key_file:        "/app/credentials.json"    
  # ID do projeto no Google Cloud / Earth Engine
  project:         "modis-500120"             

  # Prefixo usado para nomear os arquivos gerados
  nome_raster: "BurnDate"                
  # Coleção MODIS de área queimada (Burned Area) --- RECENTEMENTE FOI ATUALIZADO A COLEÇÃO NO GEE
  collection:  "MODIS/061/MCD64A1"       
  # Tipo selecionado dentro da coleção
  selection:   "BurnDate"

  # Selecionar qual biblioteca para baixar o dado do GEE, FAO é uma colecao mais detalhada dos limites (Fronteiras dos Canadá excede o limite do GEE) alternativa para o Canadá(USDOS).  
  # Teste apresentaram resultados diferentes para o limites do BRASIL, com os dados reproduzindo teste anteriores no QGIS apenas a coleção da FAO (PESQUISAR SOBRE ESSE PROBLEMA)
  ## Coleção da area de estudo (shapefile) no GEE
  area_asset: "FAO/GAUL/2015/level0" # -- Repositorio de áreas do GEE (FAO/GAUL 2015) 
    #area_asset: "USDOS/LSIB_SIMPLE/2017" # -- Repositorio de áreas do GEE (LSIB 2017) -- RECOMENDADO O NÃO USO PARA O DOWNLOAD NO LIMITE DO BRASIL
  ## Atributo usado para filtrar o país na coleção de áreas
  area_attr: "ADM0_NAME" # -- Repositorio de áreas do GEE (FAO/GAUL 2015)
    #area_attr: "country_na" # "ADM0_NAME" -- Repositorio de áreas do GEE (LSIB 2017) -- RECOMENDADO O NÃO USO PARA O DOWNLOAD NO LIMITE DO BRASIL
  ## Nome do país na coleção de áreas (LSIB 2017)
  area_name: "Brazil" # "Canada" -- Repositorio de áreas do GEE (LSIB 2017 ou FAO/GAUL 2015)

  # Limite conservador por tile (MB)                
  gee_limit_mb: 40
  # Tempo máximo de download por tile (segundos)
  timeout_s:    1800
  # Tamanho do chunk no streaming do zip (bytes)
  chunk_size:   8388608  # 8*1024*1024 = (1 megaByte)