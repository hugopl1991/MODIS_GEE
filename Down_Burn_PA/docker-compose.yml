# =============================================================================
# Pipeline Sequencial — Estoque de Queimadas (MODIS)
# =============================================================================
# Pipeline planejado em quatro etapas: Down Raster -> Burn Freq -> Queimadas -> Borda.
# Por enquanto, apenas o serviço "npi_down" está implementado sepadamente o Downlaod.
#
# O serviço tem restart: "no" — roda uma vez e encerra.
# =============================================================================

services:
  # ===========================================================================
  # SERVIÇO: npi_down
  # Constrói a imagem npi-geo:latest a partir do Dockerfile local e executa
  # o download dos rasters mensais MODIS MCD64A1 (área queimada) via Earth Engine.
  # ===========================================================================
  npi_down:
    build:
      context: .              
      dockerfile: Dockerfile
    image: npi-geo:latest
    container_name: npi_down
    command: python /app/scripts/NPI_Down_v4.py

    volumes:
      # Mapeia toda a pasta atual (onde está o config.yaml e a pasta inputs) para /dados
      - ./:/dados
      # Mapeia a subpasta scripts para o local esperado pelo comando de execução
      - ./scripts:/app/scripts
      # Mapeia o arquivo de credenciais diretamente na pasta atual
      - ./modis-500120-203ee5f0b452.json:/app/credentials.json:ro

    working_dir: /dados   # Diretório de trabalho — onde config.yaml e o shapefile são lidos

    restart: "no" # Execução única — não reinicia em caso de falha ou término
